spring:
  application:
    name: Api-Gateway
  cloud:
    gateway:
      routes:
        # Movie-Catalog-Service Route
        - id: Movie-Catalog
          uri: lb://Movie-Catalog   # spring cloud load balancer performs load balancing
          predicates:
            - Path=/app/**
        # Movie-Info-Service Route
        - id: Movie-Info-Service
          uri: lb://Movie-Info-Service
          predicates:
            - Path=/ci/**

server:
  port: 9876

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    instance:
      preferIpAddress: true
    registryFetchIntervalSeconds: 5
    registerWithEureka: true
    fetchRegistry: true

management:
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: "*"

app:
  eureka-server: localhost
